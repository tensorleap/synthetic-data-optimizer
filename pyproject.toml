[project]
name = "synthetic-data-optimizer"
version = "0.1.0"
description = ""
authors = [
    {name = "ranhomri",email = "ran.homri@tensorleap.ai"}
]
readme = "README.md"
requires-python = ">=3.8, <3.9"
dependencies = [
    "numpy>=1.20.0,<1.25.0",
    "torch>=2.0.0,<2.1.0",
    "torchvision>=0.15.0,<0.16.0",
    "scikit-learn>=1.0.0,<1.4.0",
    "pillow>=9.0.0,<11.0.0",
    "matplotlib>=3.5.0,<3.8.0",
    "seaborn>=0.12.0,<0.14.0",
    "pyyaml>=6.0.0,<7.0.0",
    "joblib>=1.1.0,<2.0.0",
    "tqdm>=4.64.0,<5.0.0",
    "opencv-python>=4.6.0,<5.0.0",
    "optuna>=3.0.0,<4.0.0",
    "pandas>=1.3.0,<2.1.0"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "jupyter>=1.0.0,<2.0.0",
    "pytest>=7.0.0,<8.0.0",
    "ipykernel>=6.0.0,<7.0.0"
]
