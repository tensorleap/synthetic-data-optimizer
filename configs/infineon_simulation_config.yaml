  # Simulation 5: Main splatter - Variant B (darker)
  main_splatter_b:
    void_type: main_splatter
    package_type: "53440"
    num_splatters_min: 1
    num_splatters_max: 2
    min_size_min: 25
    min_size_max: 40
    max_size_min: 40
    max_size_max: 70
    main_darkness_min: 0.30
    main_darkness_max: 0.70
    droplet_darkness_min: 0.15
    droplet_darkness_max: 0.35
    droplet_count_min: 15
