    main_darkness_max: 0.45
    droplet_darkness_min: 0.06
    droplet_darkness_max: 0.15
    droplet_count_min: 2
    droplet_count_max: 12
    droplet_size_min: 0.0008
    droplet_size_max: 0.008
    droplet_distance_min: 0.6
    droplet_distance_max: 1.2
    shadow_intensity: 0.4
    shadow_radius_factor: 0.8
    shadow_noise: 0.4
    shadow_blur: 1.5
    light_intensity: 0.5
    light_radius_factor: 1.3
    halo_noise: 0.4
    gradient_direction: center_dark
    droplet_blur: 1.2
    main_blur: 1.8

  # Simulation 2: Complex splatters - Variant B (more, larger)
  complex_splatter_b:
    void_type: complex_splatter
    package_type: "53439"
    num_splatters_min: 15
    num_splatters_max: 25
    min_size_min: 12
    min_size_max: 25
    max_size_min: 30
    max_size_max: 55
    main_darkness_min: 0.35
    main_darkness_max: 0.60
    droplet_darkness_min: 0.10
    droplet_darkness_max: 0.22
    droplet_count_min: 8
    droplet_count_max: 25
    droplet_size_min: 0.001
    droplet_size_max: 0.012
    droplet_distance_min: 0.8
    droplet_distance_max: 1.6
    shadow_intensity: 0.7
    shadow_radius_factor: 1.2
    shadow_noise: 0.6
    shadow_blur: 2.5
    light_intensity: 0.8
    light_radius_factor: 1.7
    halo_noise: 0.6
    gradient_direction: edge_dark
    droplet_blur: 1.8
    main_blur: 2.2

  # Simulation 3: Dark bezel - Variant A (smaller)
  dark_bezel_a:
    void_type: dark_bezel
    package_type: "53440"
    num_voids_min: 1
    num_voids_max: 2
