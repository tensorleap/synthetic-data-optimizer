# Local experiment configuration
# Contains settings for local development and synthetic data generation
# This file should NOT be used in production - it's for testing the optimization pipeline locally

# Experiment identification
experiment_name: "local_test_grouped_params"
experiments_base_dir: "data/experiments"

# Random seed
random_seed: 42

# Iteration settings (smaller values for local testing)
iteration_batch_size: 8       # param sets per iteration
replications_per_iteration: 10
max_iterations: 5

# Parameter precision (decimal places for rounding)
param_precision:
  base_size: 1
  rotation: 1
  center_x: 2
  center_y: 2
  position_spread: 2

# Optimization metrics
optimization_metrics:
  - mmd_rbf
  - mean_nn_distance

# Convergence criteria
convergence_threshold: 0.05
early_stop_patience: 3

# Optimizer settings
optimizer:
  n_startup_trials: 12        # 4 per group for faster local testing
  multivariate: true

# Output settings
top_n_distributions: 5

# Base data for local testing
base_image_dir: "data/base_chips"  # 5 NoVoids images for local generation

# Model settings (only needed for local testing - in prod embeddings come from Tensorleap)
dino_model: "dinov2_vitb14"        # 768-dim embeddings
pca_embedding_dim: 400             # reduce to 400-dim for optimization
pca_visualization_dim: 2           # further reduce to 2D for visualization

# Dataset sizes for local testing
real:
  param_sets: 10
  replications: 5

close:
  param_sets: 10
  replications: 50

far:
  param_sets: 10
  replications: 50

# Initial condition for optimization (iteration 0)
initial_condition: 'far'  # 'close' or 'far' - determines starting synthetic distribution

# Parameter distributions for synthetic data generation
# These define how to sample parameters for each distribution type
param_distributions:
  real:
    void_shape:
      probabilities:
        circle: 0.2
        ellipse: 0.5
        irregular: 0.3
    void_count:
      min: 1
      max: 7
    base_size:
      min: 7
      max: 13
    rotation:
      min: 90
      max: 270
    center_x:
      min: 0.35
      max: 0.65
    center_y:
      min: 0.35
      max: 0.65
    position_spread:
      min: 0.35
      max: 0.65

  close:
    void_shape:
      probabilities:
        circle: 0.25
        ellipse: 0.45
        irregular: 0.3
    void_count:
      min: 7
      max: 13
    base_size:
      min: 13
      max: 23
    rotation:
      min: 90
      max: 270
    center_x:
      min: 0.35
      max: 0.65
    center_y:
      min: 0.35
      max: 0.65
    position_spread:
      min: 0.40
      max: 0.70

  far:
    void_shape:
      probabilities:
        circle: 0.1
        ellipse: 0.1
        irregular: 0.8
    void_count:
      min: 17
      max: 23
    base_size:
      min: 2
      max: 6
    rotation:
      min: 25
      max: 65
    center_x:
      min: 0.55
      max: 0.85
    center_y:
      min: 0
      max: 0.25
    position_spread:
      min: 0.90
      max: 1.0

  circular_shadow:
    void_type: circular_shadow
    package_type: "53440"
    num_splatters_min: 1
    num_splatters_max: 3
    radius_min: 20
    radius_max: 60
    irregularity_min: 0.03
    irregularity_max: 0.15
    shadow_width_min: 0.10
    shadow_width_max: 0.25
    shadow_opacity_min: 0.70
    shadow_opacity_max: 0.98

  complex_splatter:
    void_type: complex_splatter
    package_type: "53439"
    num_splatters_min: 10
    num_splatters_max: 20
    min_size_min: 10
    min_size_max: 20
    max_size_min: 25
    max_size_max: 45
    main_darkness_min: 0.30
    main_darkness_max: 0.50
    droplet_darkness_min: 0.08
    droplet_darkness_max: 0.18
    droplet_count_min: 3
    droplet_count_max: 18
    droplet_size_min: 0.001
    droplet_size_max: 0.010
    droplet_distance_min: 0.7
    droplet_distance_max: 1.4
    shadow_intensity: 0.5
    shadow_radius_factor: 1.0
    shadow_noise: 0.5
    shadow_blur: 2.0
    light_intensity: 0.6
    light_radius_factor: 1.5
    halo_noise: 0.5
    gradient_direction: edge_dark
    droplet_blur: 1.5
    main_blur: 2.0

  dark_bezel:
    void_type: dark_bezel
    package_type: "53440"
    num_voids_min: 1
    num_voids_max: 3
    void_size_min: 20
    void_size_max: 60

  hole_like:
    void_type: hole_like
    package_type: "53438"
    num_splatters_min: 1
    num_splatters_max: 2
    min_size_min: 20
    min_size_max: 35
    max_size_min: 35
    max_size_max: 60
    droplet_darkness_min: 0.12
    droplet_darkness_max: 0.28
    droplet_count_min: 1
    droplet_count_max: 3
    droplet_size_min: 0.008
    droplet_size_max: 0.025
    droplet_distance_min: 0.05
    droplet_distance_max: 1.0

  main_splatter:
    void_type: main_splatter
    package_type: "53440"
    num_splatters_min: 1
    num_splatters_max: 2
    min_size_min: 20
    min_size_max: 35
    max_size_min: 35
    max_size_max: 60
    main_darkness_min: 0.20
    main_darkness_max: 0.60
    droplet_darkness_min: 0.12
    droplet_darkness_max: 0.30
    droplet_count_min: 8
    droplet_count_max: 30
    droplet_size_min: 0.0005
    droplet_size_max: 0.010
    droplet_distance_min: 0.8
    droplet_distance_max: 1.4

  structured_void:
    void_type: structured_void
    package_type: "53440"
    num_voids_min: 1
    num_voids_max: 3
    void_size_min: 15
    void_size_max: 30
    direction: random
    stretch_min: 2.0
    stretch_max: 5.0
    darkness_min: 0.40
    darkness_max: 0.60

# Legacy bounds (kept for reference, actual bounds are inferred from real data)
distribution_param_bounds:
  void_shape: [circle, ellipse, irregular]  # Categorical
  void_count_min: [1, 25]
  void_count_max: [1, 25]
  base_size_min: [2.0, 25.0]
  base_size_max: [2.0, 25.0]
  rotation_min: [0.0, 360.0]
  rotation_max: [0.0, 360.0]
  center_x_min: [0.1, 0.9]
  center_x_max: [0.1, 0.9]
  center_y_min: [0.1, 0.9]
  center_y_max: [0.1, 0.9]
  position_spread_min: [0.1, 1.0]
  position_spread_max: [0.1, 1.0]
